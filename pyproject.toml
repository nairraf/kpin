[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kpin"
version = "0.2.0"
description = "Inject secrets from a KeePassXC vault into dev commands, without printing them."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ian" }]
keywords = ["secrets", "keepass", "keepassxc", "cli", "env", "injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development",
]
dependencies = ["pykeepass>=4.0"]

[project.urls]
Homepage = "https://github.com/nairraf/kpin"
Repository = "https://github.com/nairraf/kpin"
Issues = "https://github.com/nairraf/kpin/issues"

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
kpin = "kpin.cli:main"

[tool.setuptools]
packages = ["kpin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
